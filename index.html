<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APE — Project Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
  :root{
    --red:#a11d2c;
    --red-dark:#7d1622;
    --cream:#fdf3f3;
    --panel:#ffffff;
    --border:#f1d9d9;
    --text:#2a1414;
    --muted:#8a6b6b;
    --green:#3f8f4f;
    --orange:#e08a1e;
    --grey:#555;
    --purple:#6b4fa0;
  }
  *{box-sizing:border-box;}
  html, body{
    margin:0;
    height:100%;
  }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--cream);
    display:flex;
    justify-content:center;
  }
  .phone{
    width:100%;
    max-width:720px;
    background:var(--cream);
    display:flex;
    flex-direction:column;
    height:100dvh;
  }
  header{
    background:#fff;
    padding:18px 20px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid var(--border);
  }
  header .logo{
    font-weight:800;
    font-size:22px;
    color:var(--red);
    letter-spacing:1px;
  }
  header .icons{display:flex;gap:14px;font-size:14px;align-items:center;}
  header .logout-link{
    color:var(--red);font-size:12px;font-weight:700;cursor:pointer;
    background:none;border:none;text-decoration:underline;
  }
  .back-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 20px 0;
  }
  .back-btn{
    background:var(--red);color:#fff;border:none;border-radius:8px;
    padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;
  }
  .edit-btn{
    background:var(--red);color:#fff;border:none;border-radius:8px;
    padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;
  }
  main{
    flex:1;
    overflow-y:auto;
    padding:16px 18px 90px;
  }
  h1.page-title{
    font-size:22px;margin:6px 0 16px;color:#1a1a1a;
  }
  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px;
    margin-bottom:14px;
    box-shadow:0 2px 6px rgba(161,29,44,0.05);
  }
  .card-top{
    display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;
    gap:10px;
  }
  .card-top h3{margin:0;font-size:16px;color:#1a1a1a;}
  .badge{
    font-size:11px;font-weight:700;color:#fff;padding:5px 10px;border-radius:12px;
    white-space:nowrap;text-transform:uppercase;letter-spacing:.3px;
  }
  .badge.Running{background:var(--red);}
  .badge.Stopped{background:var(--orange);}
  .badge.Active{background:#3b3b46;}
  .badge.Finished{background:var(--green);}
  .badge.Complete{background:var(--green);}
  .badge.None{background:#9a9a9a;}
  .badge.Idle{background:#9a9a9a;}
  .badge.Maintenance{background:var(--purple);}
  .dates{font-size:12px;color:var(--muted);margin-bottom:10px;}
  .progress-track{
    height:8px;background:#f3dede;border-radius:6px;overflow:hidden;margin-bottom:8px;
  }
  .progress-fill{height:100%;background:var(--red);}
  .progress-fill.done{background:var(--green);}
  .steps-count{font-size:12px;color:#333;}
  .empty{
    text-align:center;color:var(--muted);font-size:14px;padding:40px 10px;
  }
  footer{
    display:flex;
    border-top:2px solid var(--red);
    background:#fff;
  }
  .nav-btn{
    flex:1;background:none;border:none;padding:10px 4px 12px;
    display:flex;flex-direction:column;align-items:center;gap:4px;
    color:var(--red);font-size:11px;cursor:pointer;font-weight:600;
  }
  .nav-btn .ic{font-size:18px;}
  .nav-btn.active{color:var(--red-dark);}
  .nav-btn.active .ic{filter:none;}
  .nav-btn.plus{color:var(--red);}

  .machine-status{font-size:12px;color:var(--muted);}
  .machine-actions{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;}

  .form-card{
    background:var(--panel);border:1px solid var(--border);border-radius:14px;
    padding:16px;margin-bottom:16px;
  }
  .form-card h2{font-size:16px;color:var(--red);margin:0 0 10px;border-bottom:1px solid var(--border);padding-bottom:10px;}
  input, select, textarea{
    width:100%;padding:10px 12px;border:1px solid #e2c9c9;border-radius:8px;
    font-size:14px;margin-bottom:10px;font-family:inherit;background:#fff;color:#222;
  }
  textarea{resize:vertical;min-height:60px;}
  .row2{display:flex;gap:10px;}
  .row2 > div{flex:1;}
  .row2 label, .field label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px;}
  .btn{
    background:var(--red);color:#fff;border:none;border-radius:8px;padding:12px;
    font-weight:700;font-size:14px;cursor:pointer;width:100%;
  }
  .btn.green{background:var(--green);}
  .btn.purple{background:var(--purple);}
  .btn.small{width:auto;padding:6px 12px;font-size:12px;font-weight:600;}
  .btn.grey{background:#8a8a8a;}
  .step-row{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--cream);border-radius:8px;padding:10px 12px;margin-bottom:8px;
    font-size:13px;
  }
  .step-row .actions{display:flex;gap:6px;}
  .step-row button{
    border:1px solid #ccc;background:#fff;border-radius:6px;padding:5px 8px;font-size:12px;cursor:pointer;
  }
  .step-row button.del{color:var(--red);border-color:var(--red);}

  .detail-step{
    background:var(--panel);border-left:5px solid var(--muted);border-radius:10px;
    padding:14px;margin-bottom:12px;box-shadow:0 2px 6px rgba(0,0,0,0.04);
  }
  .detail-step.complete{border-left-color:var(--green);}
  .detail-step.active-step{border-left-color:var(--red);}
  .detail-step.none-step{border-left-color:#bbb;}
  .detail-step-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
  .detail-step-top h4{margin:0;font-size:15px;}
  .detail-meta{font-size:12px;color:var(--muted);}
  .inline-form{margin-top:10px;}

  .toast{
    position:fixed;bottom:100px;left:50%;transform:translateX(-50%);
    background:#222;color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;
    opacity:0;pointer-events:none;transition:opacity .25s;z-index:50;
  }
  .toast.show{opacity:1;}
  select{-webkit-appearance:none;appearance:none;}
  .hint{font-size:11px;color:var(--muted);margin:-4px 0 10px;}
  .empty.small{padding:16px;}

  /* Login screen */
  .login-wrap{
    flex:1;display:flex;flex-direction:column;justify-content:center;
    padding:30px 26px;
  }
  .login-wrap h1{color:var(--red);font-size:24px;margin:0 0 4px;}
  .login-wrap p.sub{color:var(--muted);font-size:13px;margin:0 0 22px;}
  .login-error{color:var(--red);font-size:13px;margin:-4px 0 10px;min-height:16px;}
  .login-loading{text-align:center;color:var(--muted);padding:40px;}
</style>
</head>
<body>

<div class="phone" id="phone">
  <div class="login-loading" id="bootLoading">Loading…</div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============ SUPABASE CLIENT ============ */
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ============ RENDER: LOGIN ============ */
function renderLogin(errorMsg){
  const phone = document.getElementById('phone');
  phone.innerHTML = `
    <div class="login-wrap">
      <h1>APE</h1>
      <p class="sub">Sign in to access your project tracker.</p>
      <div class="login-error">${errorMsg ? escapeHtml(errorMsg) : ''}</div>
      <input type="text" id="loginUser" placeholder="Email" autocomplete="username">
      <input type="password" id="loginPass" placeholder="Password" autocomplete="current-password">
      <button class="btn" id="loginBtn">LOG IN</button>
    </div>`;

  const doLogin = async ()=>{
    const email = document.getElementById('loginUser').value.trim();
    const password = document.getElementById('loginPass').value;
    if(!email || !password){ renderLogin('Enter your email and password'); return; }
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if(error){ renderLogin('Incorrect email or password'); return; }
    await bootApp();
  };
  document.getElementById('loginBtn').onclick = doLogin;
  phone.querySelectorAll('input').forEach(inp=>{
    inp.onkeydown = e=>{ if(e.key==='Enter') doLogin(); };
  });
}

/* ============ APP SHELL (rendered after login) ============ */
function renderAppShell(){
  const phone = document.getElementById('phone');
  phone.innerHTML = `
    <header>
      <div class="logo">APE</div>
      <div class="icons">
        <button class="logout-link" id="logoutBtn">Log out</button>
      </div>
    </header>
    <div id="subheader"></div>
    <main id="main"></main>
    <footer>
      <button class="nav-btn" data-view="projects"><span class="ic">📁</span>Projects</button>
      <button class="nav-btn" data-view="completed"><span class="ic">✔️</span>Completed</button>
      <button class="nav-btn" data-view="machines"><span class="ic">🖥️</span>Machines</button>
      <button class="nav-btn" data-view="add"><span class="ic">➕</span>Add Project</button>
    </footer>`;

  document.getElementById('logoutBtn').onclick = async ()=>{
    await sb.auth.signOut();
    renderLogin();
  };

  document.querySelectorAll('.nav-btn').forEach(btn=>{
    btn.onclick = ()=>{
      state.view = btn.dataset.view;
      state.currentProjectId = null;
      state.editingProject = btn.dataset.view === 'add' ? null : state.editingProject;
      render();
    };
  });
}

/* ============ DATA LAYER (Supabase-backed) ============ */
function defaultData(){
  return { projects: [], machines: [] };
}

let DB = defaultData();
let currentUserId = null;

async function loadData(){
  const { data: { user } } = await sb.auth.getUser();
  currentUserId = user.id;

  const { data, error } = await sb
    .from('app_data')
    .select('data')
    .eq('user_id', currentUserId)
    .maybeSingle();

  if(error) throw error;
  DB = data && data.data ? Object.assign(defaultData(), data.data) : defaultData();
}

async function saveData(data){
  try{
    const { error } = await sb
      .from('app_data')
      .upsert({ user_id: currentUserId, data, updated_at: new Date().toISOString() });
    if(error) throw error;
    return true;
  }catch(e){
    console.error('Save failed', e);
    showToast('Could not save — check your connection');
    return false;
  }
}

/* ============ APP STATE ============ */
let state = {
  view: 'projects',
  currentProjectId: null,
  editingProject: null,
  activeStepInputId: null,
  maintenanceEditId: null
};

/* ============ HELPERS ============ */
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}
function fmtDate(str){
  if(!str) return '';
  const [y,m,d] = str.split('-');
  if(!y) return str;
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${d} ${months[parseInt(m,10)-1]} ${y}`;
}
function projectProgress(p){
  const children = DB.projects.filter(x=>x.parentId===p.id);
  const totalSteps = p.steps.length;
  const doneSteps = p.steps.filter(s=>s.status==='Complete').length;
  const totalChildren = children.length;
  const doneChildren = children.filter(c=>c.status==='Complete').length;
  return { done: doneSteps+doneChildren, total: totalSteps+totalChildren };
}
function getChildren(p){
  return DB.projects.filter(x=>x.parentId===p.id);
}
function escapeHtml(str){
  return (str||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ============ PROJECT STATUS LOGIC ============ */
function recomputeProjectStatus(p){
  const children = getChildren(p);
  children.forEach(recomputeProjectStatus); // post-order: children resolved before parent

  const totalSteps = p.steps.length;
  const doneSteps = p.steps.filter(s=>s.status==='Complete').length;
  const anyStepActive = p.steps.some(s=>s.status==='Active');

  const totalChildren = children.length;
  const doneChildren = children.filter(c=>c.status==='Complete').length;
  const anyChildActive = children.some(c=>c.status==='Running' || c.status==='Active');

  const totalUnits = totalSteps + totalChildren;
  const doneUnits = doneSteps + doneChildren;

  if(totalUnits === 0){ p.status = 'Active'; return; }
  if(doneUnits === totalUnits){ p.status = 'Complete'; return; }
  if(anyStepActive || anyChildActive){ p.status = 'Running'; return; }
  if(doneUnits > 0){ p.status = 'Stopped'; return; }
  p.status = 'Active';
}
function recomputeAllStatuses(){
  DB.projects.filter(p=>!p.parentId).forEach(recomputeProjectStatus);
}

/* ============ MACHINE STATUS LOGIC ============ */
function computeMachineStatus(m){
  if(m.maintenance) return 'Maintenance';
  let linked = false;
  for(const p of DB.projects){
    if(p.status === 'Complete') continue;
    for(const s of p.steps){
      if(s.machine === m.name){
        linked = true;
        if(s.status === 'Active') return 'Running';
      }
    }
  }
  return linked ? 'Stopped' : 'Idle';
}

/* ============ RENDER: NAV ============ */
function renderNav(){
  document.querySelectorAll('.nav-btn').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.view === state.view || (state.view==='detail' && btn.dataset.view==='projects'));
  });
}

function renderSubheader(){
  const sub = document.getElementById('subheader');
  if(state.view === 'detail'){
    const p = DB.projects.find(x=>x.id===state.currentProjectId);
    sub.innerHTML = `
      <div class="back-row">
        <button class="back-btn" id="backBtn">← Back</button>
        <button class="edit-btn" id="editProjectBtn">Edit Project</button>
      </div>`;
    sub.querySelector('#backBtn').onclick = ()=>{
      if(p && p.parentId){ state.currentProjectId = p.parentId; }
      else { state.view='projects'; state.currentProjectId=null; }
      render();
    };
    sub.querySelector('#editProjectBtn').onclick = ()=>{ startEditProject(p.id); };
  } else {
    sub.innerHTML = '';
  }
}

function render(){
  renderNav();
  renderSubheader();
  const main = document.getElementById('main');
  if(state.view === 'projects') return renderProjectsList(main);
  if(state.view === 'completed') return renderCompletedList(main);
  if(state.view === 'machines') return renderMachines(main);
  if(state.view === 'add') return renderAddProject(main);
  if(state.view === 'detail') return renderProjectDetail(main);
}

function renderProjectsList(main){
  const active = DB.projects.filter(p=>!p.parentId && p.status !== 'Complete');
  let html = `<h1 class="page-title">Active Projects</h1>`;
  if(active.length===0){
    html += `<div class="empty">No active projects yet.<br>Tap "Add Project" below to start one.</div>`;
  } else {
    active.forEach(p=>{
      const {done,total} = projectProgress(p);
      const pct = total ? Math.round((done/total)*100) : 0;
      html += `
        <div class="card" data-id="${p.id}">
          <div class="card-top">
            <h3>${escapeHtml(p.name)}</h3>
            <span class="badge ${p.status}">${p.status}</span>
          </div>
          <div class="dates">${fmtDate(p.startDate)} — ${fmtDate(p.endDate)}</div>
          <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
          <div class="steps-count">${done} / ${total} Completed</div>
        </div>`;
    });
  }
  main.innerHTML = html;
  main.querySelectorAll('.card').forEach(c=>{
    c.onclick = ()=>{ state.view='detail'; state.currentProjectId=c.dataset.id; render(); };
  });
}

function renderCompletedList(main){
  const done = DB.projects.filter(p=>!p.parentId && p.status === 'Complete');
  let html = `<h1 class="page-title">Completed Projects</h1>`;
  if(done.length===0){
    html += `<div class="empty">No completed projects yet.</div>`;
  } else {
    done.forEach(p=>{
      const {done:d,total:t} = projectProgress(p);
      html += `
        <div class="card" data-id="${p.id}">
          <div class="card-top">
            <h3>${escapeHtml(p.name)}</h3>
            <span class="badge Complete">COMPLETE</span>
          </div>
          <div class="dates">${fmtDate(p.startDate)} — ${fmtDate(p.endDate)}</div>
          <div class="progress-track"><div class="progress-fill done" style="width:100%"></div></div>
          <div class="steps-count">${d} / ${t} Completed</div>
        </div>`;
    });
  }
  main.innerHTML = html;
  main.querySelectorAll('.card').forEach(c=>{
    c.onclick = ()=>{ state.view='detail'; state.currentProjectId=c.dataset.id; render(); };
  });
}

function renderMachines(main){
  let html = `<h1 class="page-title">Machines</h1>`;
  html += `
    <div class="form-card">
      <h2>Add Machine</h2>
      <input type="text" id="newMachineName" placeholder="Machine Name">
      <button class="btn" id="addMachineBtn">ADD MACHINE</button>
    </div>`;

  if(DB.machines.length === 0){
    html += `<div class="empty">No machines yet.<br>Add one above to track it here and use it in project steps.</div>`;
  } else {
    DB.machines.forEach(m=>{
      const status = computeMachineStatus(m);
      html += `
        <div class="card" data-mid="${m.id}">
          <div class="card-top">
            <h3>${escapeHtml(m.name)}</h3>
            <span class="badge ${status}">${status.toUpperCase()}</span>
          </div>
          <div class="machine-status">
            ${m.maintenance
              ? escapeHtml(m.maintenanceNote || 'No maintenance notes added.')
              : 'Status is tracked automatically from linked project steps.'}
          </div>
          <div class="machine-actions">
            ${m.maintenance
              ? `<button class="btn small purple edit-maintenance" data-id="${m.id}">Edit Notes</button>
                 <button class="btn small green return-service" data-id="${m.id}">Return to Service</button>`
              : `<button class="btn small purple start-maintenance" data-id="${m.id}">Start Maintenance</button>`}
            <button class="btn small remove-machine" data-id="${m.id}" style="border-color:var(--red);color:var(--red);background:#fff;">Remove</button>
          </div>
          ${state.maintenanceEditId === m.id ? `
            <div class="inline-form">
              <textarea id="maintNote_${m.id}" placeholder="Maintenance notes (technician, expected completion, etc.)">${escapeHtml(m.maintenanceNote||'')}</textarea>
              <button class="btn green save-maintenance" data-id="${m.id}">Save Notes</button>
            </div>` : ''}
        </div>`;
    });
  }

  main.innerHTML = html;

  document.getElementById('addMachineBtn').onclick = async ()=>{
    const input = document.getElementById('newMachineName');
    const name = input.value.trim();
    if(!name){ showToast('Machine name is required'); return; }
    if(DB.machines.some(m=>m.name.toLowerCase()===name.toLowerCase())){
      showToast('A machine with that name already exists');
      return;
    }
    DB.machines.push({ id: uid(), name, maintenance:false, maintenanceNote:'' });
    await saveData(DB);
    showToast('Machine added');
    render();
  };

  main.querySelectorAll('.start-maintenance').forEach(btn=>{
    btn.onclick = async ()=>{
      const m = DB.machines.find(x=>x.id===btn.dataset.id);
      m.maintenance = true;
      state.maintenanceEditId = m.id;
      await saveData(DB);
      render();
    };
  });
  main.querySelectorAll('.edit-maintenance').forEach(btn=>{
    btn.onclick = ()=>{ state.maintenanceEditId = btn.dataset.id; render(); };
  });
  main.querySelectorAll('.save-maintenance').forEach(btn=>{
    btn.onclick = async ()=>{
      const m = DB.machines.find(x=>x.id===btn.dataset.id);
      m.maintenanceNote = document.getElementById('maintNote_'+m.id).value.trim();
      state.maintenanceEditId = null;
      await saveData(DB);
      showToast('Maintenance notes saved');
      render();
    };
  });
  main.querySelectorAll('.return-service').forEach(btn=>{
    btn.onclick = async ()=>{
      const m = DB.machines.find(x=>x.id===btn.dataset.id);
      m.maintenance =
