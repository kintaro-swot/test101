<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APE — Project Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
  :root{
    der:#f1d9d9;
    --text:#2a1414;
    --muted:#8a6b6b;
    --green:#3f8f4f;
    --orange:#e08a1e;
    --grey:#555;
    --purple:#6b4fa0;
  }
  *{box-sizing:border-box;}
  html, body{margin:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--cream);
    display:flex;
    justify-content:center;
  }
  .phone{
    width:100%;
    max-width:720px;
    background:var(--cream);
    display:flex;
    flex-direction:column;
    height:100dvh;
  }
  header{
    background:#fff;
    padding:18px 20px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid var(--border);
  }
  header .logo{font-weight:800;font-size:22px;color:var(--red);letter-spacing:1px;}
  header .icons{display:flex;gap:14px;font-size:14px;align-items:center;}
  header .logout-link{color:var(--red);font-size:12px;font-weight:700;cursor:pointer;background:none;border:none;text-decoration:underline;}
  .back-row{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 0;}
  .back-btn, .edit-btn{background:var(--red);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;}
  main{flex:1;overflow-y:auto;padding:16px 18px 90px;}
  h1.page-title{font-size:22px;margin:6px 0 16px;color:#1a1a1a;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 6px rgba(161,29,44,0.05);}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;gap:10px;}
  .card-top h3{margin:0;font-size:16px;color:#1a1a1a;}
  .badge{font-size:11px;font-weight:700;color:#fff;padding:5px 10px;border-radius:12px;white-space:nowrap;text-transform:uppercase;letter-spacing:.3px;}
  .badge.Running{background:var(--red);}
  .badge.Stopped{background:var(--orange);}
  .badge.Active{background:#3b3b46;}
  .badge.Complete{background:var(--green);}
  .badge.None{background:#9a9a9a;}
  .badge.Idle{background:#9a9a9a;}
  .badge.Maintenance{background:var(--purple);}
  .dates{font-size:12px;color:var(--muted);margin-bottom:10px;}
  .progress-track{height:8px;background:#f3dede;border-radius:6px;overflow:hidden;margin-bottom:8px;}
  .progress-fill{height:100%;background:var(--red);}
  .progress-fill.done{background:var(--green);}
  .steps-count{font-size:12px;color:#333;}
  .empty{text-align:center;color:var(--muted);font-size:14px;padding:40px 10px;}
  .empty.small{padding:12px;}
  footer{display:flex;border-top:2px solid var(--red);background:#fff;}
  .nav-btn{flex:1;background:none;border:none;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--red);font-size:11px;cursor:pointer;font-weight:600;}
  .nav-btn .ic{font-size:18px;}
  .nav-btn.active{color:var(--red-dark);}

  .machine-status{font-size:12px;color:var(--muted);}
  .machine-actions{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;}

  .form-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:16px;}
  .form-card h2{font-size:16px;color:var(--red);margin:0 0 10px;border-bottom:1px solid var(--border);padding-bottom:10px;}
  input, select, textarea{width:100%;padding:10px 12px;border:1px solid #e2c9c9;border-radius:8px;font-size:14px;margin-bottom:10px;font-family:inherit;background:#fff;color:#222;}
  textarea{resize:vertical;min-height:60px;}
  .row2{display:flex;gap:10px;}
  .row2 > div{flex:1;}
  .row2 label, .field label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px;}
  .btn{background:var(--red);color:#fff;border:none;border-radius:8px;padding:12px;font-weight:700;font-size:14px;cursor:pointer;width:100%;}
  .btn.green{background:var(--green);}
  .btn.purple{background:var(--purple);}
  .btn.small{width:auto;padding:6px 12px;font-size:12px;font-weight:600;}
  .btn.grey{background:#8a8a8a;}
  .step-row{display:flex;align-items:center;justify-content:space-between;background:var(--cream);border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:13px;}
  .step-row .actions{display:flex;gap:6px;}
  .step-row button{border:1px solid #ccc;background:#fff;border-radius:6px;padding:5px 8px;font-size:12px;cursor:pointer;}
  .step-row button.del{color:var(--red);border-color:var(--red);}

  .detail-step{background:var(--panel);border-left:5px solid var(--muted);border-radius:10px;padding:14px;margin-bottom:12px;box-shadow:0 2px 6px rgba(0,0,0,0.04);}
  .detail-step.complete{border-left-color:var(--green);}
  .detail-step.active-step{border-left-color:var(--red);}
  .detail-step.none-step{border-left-color:#bbb;}
  .detail-step-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
  .detail-step-top h4{margin:0;font-size:15px;}
  .detail-meta{font-size:12px;color:var(--muted);}
  .inline-form{margin-top:10px;}

  .toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:50;}
  .toast.show{opacity:1;}
  select{-webkit-appearance:none;appearance:none;}
  .hint{font-size:11px;color:var(--muted);margin:-4px 0 10px;}

  .login-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;padding:30px 26px;}
  .login-wrap h1{color:var(--red);font-size:24px;margin:0 0 4px;}
  .login-wrap p.sub{color:var(--muted);font-size:13px;margin:0 0 22px;}
  .login-error{color:var(--red);font-size:13px;margin:-4px 0 10px;min-height:16px;}
  .login-loading{text-align:center;color:var(--muted);padding:40px;}

  .subprojects-heading{font-size:14px;font-weight:700;color:var(--red);margin:20px 0 10px;}
  .remove-x{border:1px solid var(--red);background:#fff;color:var(--red);border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer;font-weight:600;}
</style>
</head>
<body>

<div class="phone" id="phone">
  <div class="login-loading" id="bootLoading">Loading…</div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============ SUPABASE CLIENT ============ */
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ============ RENDER: LOGIN ============ */
function renderLogin(errorMsg){
  const phone = document.getElementById('phone');
  phone.innerHTML = `
    <div class="login-wrap">
      <h1>APE</h1>
      <p class="sub">Sign in to access your project tracker.</p>
      <div class="login-error">${errorMsg ? escapeHtml(errorMsg) : ''}</div>
      <input type="text" id="loginUser" placeholder="Email" autocomplete="username">
      <input type="password" id="loginPass" placeholder="Password" autocomplete="current-password">
      <button class="btn" id="loginBtn">LOG IN</button>
    </div>`;

  const doLogin = async ()=>{
    const email = document.getElementById('loginUser').value.trim();
    const password = document.getElementById('loginPass').value;
    if(!email || !password){ renderLogin('Enter your email and password'); return; }
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if(error){ renderLogin('Incorrect email or password'); return; }
    await bootApp();
  };
  document.getElementById('loginBtn').onclick = doLogin;
  phone.querySelectorAll('input').forEach(inp=>{
    inp.onkeydown = e=>{ if(e.key==='Enter') doLogin(); };
  });
}

/* ============ APP SHELL ============ */
function renderAppShell(){
  const phone = document.getElementById('phone');
  phone.innerHTML = `
    <header>
      <div class="logo">APE</div>
      <div class="icons"><button class="logout-link" id="logoutBtn">Log out</button></div>
    </header>
    <div id="subheader"></div>
    <main id="main"></main>
    <footer>
      <button class="nav-btn" data-view="projects"><span class="ic">📁</span>Projects</button>
      <button class="nav-btn" data-view="completed"><span class="ic">✔️</span>Completed</button>
      <button class="nav-btn" data-view="equipment"><span class="ic">🖥️</span>Equipment</button>
      <button class="nav-btn" data-view="add"><span class="ic">➕</span>Add Project</button>
    </footer>`;

  document.getElementById('logoutBtn').onclick = async ()=>{
    await sb.auth.signOut();
    renderLogin();
  };

  document.querySelectorAll('.nav-btn').forEach(btn=>{
    btn.onclick = ()=>{
      state.view = btn.dataset.view;
      state.detailStack = [];
      if(btn.dataset.view === 'add'){ state.editingProject = null; state.newParentId = null; }
      render();
    };
  });
}

/* ============ DATA LAYER (Supabase-backed) ============ */
function defaultData(){
  return { projects: [], equipment: [] };
}

// Every project node — top-level or nested — has the same shape:
// { id, name, startDate, endDate, status, steps:[...], children:[...] }
// Migrates any older saved shape into this one.
function migrateData(raw){
  const d = Object.assign(defaultData(), raw);
  if(raw.machines && !raw.equipment){
    d.equipment = raw.machines;
  }

  function convertPart(part, dates){
    return {
      id: part.id || uid(), name: part.name,
      startDate: dates.startDate, endDate: dates.endDate, status: 'Active',
      steps: (part.steps || []).map(s=>({...s})),
      children: (part.children || []).map(c=>convertPart(c, dates))
    };
  }
  function ensureNode(n){
    n.steps = n.steps || [];
    n.children = (n.children || []).map(ensureNode);
    return n;
  }

  const newProjects = [];
  (raw.projects || []).forEach(p=>{
    if(p.parts !== undefined){
      // shape: project -> parts[] (tree of parts, no direct project-level steps)
      newProjects.push({
        id: p.id, name: p.name, startDate: p.startDate, endDate: p.endDate, status: 'Active',
        steps: [],
        children: (p.parts || []).map(part => convertPart(part, {startDate:p.startDate, endDate:p.endDate}))
      });
      return;
    }
    if(p.machines !== undefined){
      // older shape: project -> machines[] -> parts[]; split into one project per machine
      const dates = {startDate:p.startDate, endDate:p.endDate};
      p.machines.forEach(m=>{
        newProjects.push({
          id: uid(), name: p.machines.length > 1 ? `${p.name} — ${m.name}` : p.name,
          startDate: p.startDate, endDate: p.endDate, status: 'Active',
          steps: [], children: (m.parts || []).map(part => convertPart(part, dates))
        });
      });
      return;
    }
    if(p.steps !== undefined && p.children === undefined){
      // oldest flat shape: project.steps directly, step.machine = equipment name
      newProjects.push({
        id: p.id, name: p.name, startDate: p.startDate, endDate: p.endDate, status: 'Active',
        steps: p.steps.map(s => ({
          id: s.id, stepNo: s.stepNo, name: s.name,
          equipment: s.machine || s.equipment || '', status: s.status,
          doneBy: s.doneBy || '', time: s.time || '', description: s.description || ''
        })),
        children: []
      });
      return;
    }
    // already current shape
    newProjects.push(ensureNode(Object.assign({ steps: [], children: [] }, p)));
  });

  d.projects = newProjects;
  return d;
}

let DB = defaultData();
let currentUserId = null;

async function loadData(){
  const { data: { user } } = await sb.auth.getUser();
  currentUserId = user.id;

  const { data, error } = await sb
    .from('app_data')
    .select('data')
    .eq('user_id', currentUserId)
    .maybeSingle();

  if(error) throw error;
  DB = data && data.data ? migrateData(data.data) : defaultData();
}

async function saveData(data){
  try{
    const { error } = await sb
      .from('app_data')
      .upsert({ user_id: currentUserId, data, updated_at: new Date().toISOString() });
    if(error) throw error;
    return true;
  }catch(e){
    console.error('Save failed', e);
    showToast('Could not save — check your connection');
    return false;
  }
}

/* ============ APP STATE ============ */
let state = {
  view: 'projects',
  detailStack: [],       // path of node ids from a top-level project down to the one currently viewed
  editingProject: null,  // draft node being created/edited in the builder screen
  newParentId: null,     // if creating a new sub-project, the id of its parent node
  activeStepInputId: null,
  maintenanceEditId: null
};

/* ============ HELPERS ============ */
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}
function fmtDate(str){
  if(!str) return '';
  const [y,m,d] = str.split('-');
  if(!y) return str;
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${d} ${months[parseInt(m,10)-1]} ${y}`;
}
function escapeHtml(str){
  return (str||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36); }

/* ============ TREE HELPERS ============ */
function findNode(nodes, id){
  for(const n of nodes){
    if(n.id === id) return n;
    const found = findNode(n.children, id);
    if(found) return found;
  }
  return null;
}
function findAndReplace(nodes, id, replacement){
  const idx = nodes.findIndex(n=>n.id===id);
  if(idx >= 0){ nodes[idx] = replacement; return true; }
  for(const n of nodes){ if(findAndReplace(n.children, id, replacement)) return true; }
  return false;
}
function removeNodeById(nodes, id){
  const idx = nodes.findIndex(n=>n.id===id);
  if(idx >= 0){ nodes.splice(idx,1); return true; }
  for(const n of nodes){ if(removeNodeById(n.children, id)) return true; }
  return false;
}
function collectStepfulNodes(nodes, pathPrefix, out){
  nodes.forEach(n=>{
    const label = pathPrefix ? pathPrefix + ' / ' + n.name : n.name;
    if(n.steps.length > 0) out.push({ id: n.id, label, count: n.steps.length });
    collectStepfulNodes(n.children, label, out);
  });
}
function currentNode(){
  if(state.detailStack.length === 0) return null;
  return findNode(DB.projects, state.detailStack[state.detailStack.length-1]);
}
function recomputeCurrentTree(){
  const topId = state.detailStack[0];
  const top = DB.projects.find(x=>x.id===topId);
  if(top) recomputeNode(top);
}

/* ============ STATUS LOGIC (Active / Running / Stopped / Complete) ============ */
function leafStatus(steps){
  if(steps.length === 0) return null;
  const doneCount = steps.filter(s=>s.status==='Complete').length;
  if(doneCount === steps.length) return 'Complete';
  if(steps.some(s=>s.status==='Active')) return 'Running';
  if(doneCount > 0) return 'Stopped';
  return 'Active';
}
function aggregateStatus(statuses){
  if(statuses.length === 0) return 'Active';
  if(statuses.every(s=>s==='Complete')) return 'Complete';
  if(statuses.some(s=>s==='Running')) return 'Running';
  if(statuses.some(s=>s!=='Active')) return 'Stopped';
  return 'Active';
}
// Recomputes status + cumulative step counts (own + all descendants), recursively.
function recomputeNode(node){
  let childDone = 0, childTotal = 0;
  const childStatuses = [];
  (node.children || []).forEach(child=>{
    recomputeNode(child);
    childDone += child.stepsDone;
    childTotal += child.stepsTotal;
    childStatuses.push(child.status);
  });
  const ownTotal = node.steps.length;
  const ownDone = node.steps.filter(s=>s.status==='Complete').length;
  node.stepsDone = ownDone + childDone;
  node.stepsTotal = ownTotal + childTotal;

  const own = leafStatus(node.steps);
  const statuses = own ? [own, ...childStatuses] : childStatuses;
  node.status = aggregateStatus(statuses);
}

/* ============ EQUIPMENT STATUS ============ */
function computeEquipmentStatus(eq){
  if(eq.maintenance) return 'Maintenance';
  let linked = false;
  for(const p of DB.projects){
    if(p.status === 'Complete') continue;
    let running = false;
    (function scan(nodes){
      nodes.forEach(n=>{
        n.steps.forEach(s=>{
          if(s.equipment === eq.name){
            linked = true;
            if(s.status === 'Active') running = true;
          }
        });
        scan(n.children);
      });
    })([p]);
    if(running) return 'Running';
  }
  return linked ? 'Stopped' : 'Idle';
}

/* ============ RENDER: NAV / SUBHEADER ============ */
function renderNav(){
  document.querySelectorAll('.nav-btn').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.view === state.view || (state.view==='detail' && btn.dataset.view==='projects'));
  });
}
function renderSubheader(){
  const sub = document.getElementById('subheader');
  if(state.view === 'detail'){
    sub.innerHTML = `
      <div class="back-row">
        <button class="back-btn" id="backBtn">← Back</button>
        <button class="edit-btn" id="editProjectBtn">Edit Project</button>
      </div>`;
    sub.querySelector('#backBtn').onclick = ()=>{
      if(state.detailStack.length > 1){ state.detailStack.pop(); }
      else { state.view = 'projects'; state.detailStack = []; }
      render();
    };
    sub.querySelector('#editProjectBtn').onclick = ()=>{
      const node = currentNode();
      state.editingProject = JSON.parse(JSON.stringify(node));
      state.newParentId = null;
      state.view = 'add';
      render();
    };
  } else {
    sub.innerHTML = '';
  }
}

function render(){
  renderNav();
  renderSubheader();
  const main = document.getElementById('main');
  if(state.view === 'projects') return renderProjectsList(main);
  if(state.view === 'completed') return renderCompletedList(main);
  if(state.view === 'equipment') return renderEquipment(main);
  if(state.view === 'add') return renderAddProject(main);
  if(state.view === 'detail') return renderProjectDetail(main);
}

/* ============ PROJECTS LIST / COMPLETED ============ */
function renderProjectsList(main){
  const active = DB.projects.filter(p=>p.status !== 'Complete');
  let html = `<h1 class="page-title">Active Projects</h1>`;
  if(active.length===0){
    html += `<div class="empty">No active projects yet.<br>Tap "Add Project" below to start one.</div>`;
  } else {
    active.forEach(p=>{
      const pct = p.stepsTotal ? Math.round((p.stepsDone/p.stepsTotal)*100) : 0;
      html += `
        <div class="card" data-id="${p.id}">
          <div class="card-top">
            <h3>${escapeHtml(p.name)}</h3>
            <span class="badge ${p.status}">${p.status}</span>
          </div>
          <div class="dates">${fmtDate(p.startDate)} — ${fmtDate(p.endDate)}</div>
          <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
          <div class="steps-count">${p.stepsDone} / ${p.stepsTotal} Steps Completed${p.children.length ? ' · '+p.children.length+' sub-project'+(p.children.length===1?'':'s') : ''}</div>
        </div>`;
    });
  }
  main.innerHTML = html;
  main.querySelectorAll('.card').forEach(c=>{
    c.onclick = ()=>{ state.view='detail'; state.detailStack=[c.dataset.id]; render(); };
  });
}

function renderCompletedList(main){
  const done = DB.projects.filter(p=>p.status === 'Complete');
  let html = `<h1 class="page-title">Completed Projects</h1>`;
  if(done.length===0){
    html += `<div class="empty">No completed projects yet.</div>`;
  } else {
    done.forEach(p=>{
      html += `
        <div class="card" data-id="${p.id}">
          <div class="card-top">
            <h3>${escapeHtml(p.name)}</h3>
            <span class="badge Complete">COMPLETE</span>
          </div>
          <div class="dates">${fmtDate(p.startDate)} — ${fmtDate(p.endDate)}</div>
          <div class="progress-track"><div class="progress-fill done" style="width:100%"></div></div>
          <div class="steps-count">${p.stepsTotal} / ${p.stepsTotal} Steps Completed</div>
        </div>`;
    });
  }
  main.innerHTML = html;
  main.querySelectorAll('.card').forEach(c=>{
    c.onclick = ()=>{ state.view='detail'; state.detailStack=[c.dataset.id]; render(); };
  });
}

/* ============ EQUIPMENT TAB ============ */
function renderEquipment(main){
  let html = `<h1 class="page-title">Equipment</h1>`;
  html += `
    <div class="form-card">
      <h2>Add Equipment</h2>
      <input type="text" id="newEquipName" placeholder="Equipment Name (e.g. VMC #1)">
      <button class="btn" id="addEquipBtn">ADD EQUIPMENT</button>
    </div>`;

  if(DB.equipment.length === 0){
    html += `<div class="empty">No equipment yet.<br>Add some above to link it to project steps.</div>`;
  } else {
    DB.equipment.forEach(eq=>{
      const status = computeEquipmentStatus(eq);
      html += `
        <div class="card" data-eid="${eq.id}">
          <div class="card-top">
            <h3>${escapeHtml(eq.name)}</h3>
            <span class="badge ${status}">${status.toUpperCase()}</span>
          </div>
          <div class="machine-status">
            ${eq.maintenance
              ? escapeHtml(eq.maintenanceNote || 'No maintenance notes added.')
              : 'Status is tracked automatically from linked project steps.'}
          </div>
          <div class="machine-actions">
            ${eq.maintenance
              ? `<button class="btn small purple edit-maintenance" data-id="${eq.id}">Edit Notes</button>
                 <button class="btn small green return-service" data-id="${eq.id}">Return to Service</button>`
              : `<button class="btn small purple start-maintenance" data-id="${eq.id}">Start Maintenance</button>`}
            <button class="remove-x remove-equip" data-id="${eq.id}">Remove</button>
          </div>
          ${state.maintenanceEditId === eq.id ? `
            <div class="inline-form">
              <textarea id="maintNote_${eq.id}" placeholder="Maintenance notes">${escapeHtml(eq.maintenanceNote||'')}</textarea>
              <button class="btn green save-maintenance" data-id="${eq.id}">Save Notes</button>
            </div>` : ''}
        </div>`;
    });
  }

  main.innerHTML = html;

  document.getElementById('addEquipBtn').onclick = async ()=>{
    const input = document.getElementById('newEquipName');
    const name = input.value.trim();
    if(!name){ showToast('Equipment name is required'); return; }
    if(DB.equipment.some(e=>e.name.toLowerCase()===name.toLowerCase())){
      showToast('Equipment with that name already exists'); return;
    }
    DB.equipment.push({ id: uid(), name, maintenance:false, maintenanceNote:'' });
    await saveData(DB);
    showToast('Equipment added');
    render();
  };

  main.querySelectorAll('.start-maintenance').forEach(btn=>{
    btn.onclick = async ()=>{
      const eq = DB.equipment.find(x=>x.id===btn.dataset.id);
      eq.maintenance = true;
      state.maintenanceEditId = eq.id;
      await saveData(DB);
      render();
    };
  });
  main.querySelectorAll('.edit-maintenance').forEach(btn=>{
    btn.onclick = ()=>{ state.maintenanceEditId = btn.dataset.id; render(); };
  });
  main.querySelectorAll('.save-maintenance').forEach(btn=>{
    btn.onclick = async ()=>{
      const eq = DB.equipment.find(x=>x.id===btn.dataset.id);
      eq.maintenanceNote = document.getElementById('maintNote_'+eq.id).value.trim();
      state.maintenanceEditId = null;
      await saveData(DB);
      showToast('Maintenance notes saved');
      render();
    };
  });
  main.querySelectorAll('.return-service').forEach(btn=>{
    btn.onclick = async ()=>{
      const eq = DB.equipment.find(x=>x.id===btn.dataset.id);
      eq.maintenance = false;
      eq.maintenanceNote = '';
      state.maintenanceEditId = null;
      await saveData(DB);
      showToast(`${eq.name} returned to automated tracking`);
      render();
    };
  });
  main.querySelectorAll('.remove-equip').forEach(btn=>{
    btn.onclick = async ()=>{
      const eq = DB.equipment.find(x=>x.id===btn.dataset.id);
      if(confirm(`Remove ${eq.name}? This won't remove it from steps that already reference it.`)){
        DB.equipment = DB.equipment.filter(x=>x.id!==eq.id);
        await saveData(DB);
        showToast('Equipment removed');
        render();
      }
    };
  });
}

/* ============ ADD / EDIT PROJECT — the single builder screen used for both
   top-level projects and sub-projects, and both create + edit ============ */
function newDraft(defaultStart, defaultEnd){
  return { id:null, name:'', startDate:defaultStart||'', endDate:defaultEnd||'', status:'Active', steps:[], children:[] };
}

function renderAddProject(main){
  if(!state.editingProject) state.editingProject = newDraft();
  const d = state.editingProject;
  const isEdit = !!d.id;
  const parent = (!isEdit && state.newParentId) ? findNode(DB.projects, state.newParentId) : null;

  let stepsHtml = '';
  if(d.steps.length===0){
    stepsHtml = `<div class="empty small">No steps added yet.</div>`;
  } else {
    d.steps.forEach((s, idx)=>{
      stepsHtml += `
        <div class="step-row">
          <span>${idx+1}. ${escapeHtml(s.name)} ${s.equipment? '('+escapeHtml(s.equipment)+')':''}</span>
          <span class="actions">
            <button class="edit-step" data-idx="${idx}">Edit</button>
            <button class="del del-step" data-idx="${idx}">Del</button>
          </span>
        </div>`;
    });
  }

  const equipOptions = DB.equipment.map(e=>`<option value="${escapeHtml(e.name)}">${escapeHtml(e.name)}</option>`).join('');

  let cloneHtml = '';
  if(!isEdit){
    const stepful = [];
    collectStepfulNodes(DB.projects, '', stepful);
    if(stepful.length){
      const options = stepful.map(x=>`<option value="${x.id}">${escapeHtml(x.label)} (${x.count} steps)</option>`).join('');
      cloneHtml = `
        <div class="form-card">
          <h2>Clone Steps (optional)</h2>
          <select id="cloneSource"><option value="">Don't clone — start blank</option>${options}</select>
          <button class="btn small purple" id="cloneBtn">LOAD STEPS FROM SELECTED</button>
          <div class="hint">Copies that project/sub-project's step list here as a starting point — you can still edit it below.</div>
        </div>`;
    }
  }

  main.innerHTML = `
    <div class="form-card">
      <h2>${isEdit ? 'Edit Project' : (parent ? `New Sub-Project of "${escapeHtml(parent.name)}"` : 'New Project')}</h2>
      <input type="text" id="pName" placeholder="Project Name" value="${escapeHtml(d.name)}">
      <div class="row2">
        <div><label>Start Date</label><input type="date" id="pStart" value="${d.startDate||''}"></div>
        <div><label>End Date</label><input type="date" id="pEnd" value="${d.endDate||''}"></div>
      </div>
    </div>

    ${cloneHtml}

    <div class="form-card">
      <h2>Add Step</h2>
      <input type="number" id="stepNo" placeholder="Step No." min="1">
      <input type="text" id="stepName" placeholder="Step Name/Function">
      <select id="stepEquip">
        <option value="">Select Equipment</option>
        ${equipOptions}
      </select>
      <button class="btn" id="saveStepBtn">SAVE STEP</button>
    </div>

    <div class="form-card">
      <h2>Saved Steps</h2>
      ${stepsHtml}
    </div>

    <button class="btn green" id="commitBtn">${isEdit ? 'SAVE PROJECT' : 'COMMIT PROJECT'}</button>
    ${isEdit ? `<button class="btn grey" id="cancelEditBtn" style="margin-top:10px;">Cancel</button>
    <button class="btn" id="deleteProjectBtn" style="margin-top:10px;background:#b3212f;">Delete Project</button>` : ''}
  `;

  document.getElementById('pName').oninput = e => d.name = e.target.value;
  document.getElementById('pStart').oninput = e => d.startDate = e.target.value;
  document.getElementById('pEnd').oninput = e => d.endDate = e.target.value;

  if(document.getElementById('cloneBtn')){
    document.getElementById('cloneBtn').onclick = ()=>{
      const sel = document.getElementById('cloneSource').value;
      if(!sel){ showToast('Pick a project/sub-project to clone from'); return; }
      const source = findNode(DB.projects, sel);
      if(!source) return;
      const cloned = source.steps.map(s=>({
        id: uid(), stepNo: s.stepNo, name: s.name, equipment: s.equipment,
        status: 'None', doneBy: '', time: '', description: ''
      }));
      d.steps = d.steps.concat(cloned);
      d.steps.sort((a,b)=>(a.stepNo||0)-(b.stepNo||0));
      showToast(`${cloned.length} step(s) loaded`);
      render();
    };
  }

  document.getElementById('saveStepBtn').onclick = ()=>{
    const no = document.getElementById('stepNo').value;
    const name = document.getElementById('stepName').value.trim();
    const equipment = document.getElementById('stepEquip').value;
    if(!name){ showToast('Step name is required'); return; }
    d.steps.push({
      id: uid(),
      stepNo: no ? parseInt(no,10) : d.steps.length+1,
      name, equipment,
      status: 'None', doneBy: '', time: '', description: ''
    });
    d.steps.sort((a,b)=> (a.stepNo||0) - (b.stepNo||0));
    render();
  };

  main.querySelectorAll('.del-step').forEach(btn=>{
    btn.onclick = ()=>{ d.steps.splice(parseInt(btn.dataset.idx,10),1); render(); };
  });
  main.querySelectorAll('.edit-step').forEach(btn=>{
    btn.onclick = ()=>{
      const s = d.steps[parseInt(btn.dataset.idx,10)];
      document.getElementById('stepNo').value = s.stepNo || '';
      document.getElementById('stepName').value = s.name;
      document.getElementById('stepEquip').value = s.equipment || '';
      d.steps.splice(parseInt(btn.dataset.idx,10),1);
      render();
    };
  });

  document.getElementById('commitBtn').onclick = async ()=>{
    if(!d.name.trim()){ showToast('Project name is required'); return; }
    if(!d.startDate || !d.endDate){ showToast('Start and end dates are required'); return; }

    if(isEdit){
      recomputeNode(d);
      findAndReplace(DB.projects, d.id, d);
      recomputeCurrentTree();
      await saveData(DB);
      showToast('Project saved');
      state.editingProject = null;
      state.view = 'detail';
      render();
    } else {
      d.id = uid();
      recomputeNode(d);
      if(state.newParentId){
        const parentNode = findNode(DB.projects, state.newParentId);
        parentNode.children.push(d);
        recomputeCurrentTree();
        state.detailStack.push(d.id);
      } else {
        DB.projects.push(d);
        state.detailStack = [d.id];
      }
      await saveData(DB);
      showToast('Project created');
      state.editingProject = null;
      state.newParentId = null;
      state.view = 'detail';
      render();
    }
  };

  if(isEdit){
    document.getElementById('cancelEditBtn').onclick = ()=>{
      state.editingProject = null;
      state.view = 'detail';
      render();
    };
    document.getElementById('deleteProjectBtn').onclick = async ()=>{
      if(confirm('Delete this project (and any sub-projects/steps inside it) permanently?')){
        const isTopLevel = state.detailStack.length <= 1;
        removeNodeById(DB.projects, d.id);
        await saveData(DB);
        state.editingProject = null;
        if(isTopLevel){
          state.view = 'projects';
          state.detailStack = [];
        } else {
          state.detailStack.pop();
          recomputeCurrentTree();
          await saveData(DB);
          state.view = 'detail';
        }
        render();
      }
    };
  }
}

/* ============ PROJECT DETAIL ============ */
function renderProjectDetail(main){
  const node = currentNode();
  if(!node){ state.view='projects'; state.detailStack=[]; return render(); }

  let html = `
    <h1 class="page-title" style="margin-bottom:2px;">${escapeHtml(node.name)}</h1>
    <div class="dates" style="margin-bottom:6px;">${fmtDate(node.startDate)} — ${fmtDate(node.endDate)}</div>
    <div style="margin-bottom:14px;"><span class="badge ${node.status}">${node.status}</span></div>
  `;

  if(node.steps.length===0 && node.children.length===0){
    html += `<div class="empty small">No steps yet — use "Edit Project" to add some, or add a sub-project below.</div>`;
  }

  node.steps.forEach(s=>{
    const cls = s.status==='Complete' ? 'complete' : (s.status==='Active' ? 'active-step' : 'none-step');
    html += `<div class="detail-step ${cls}">
      <div class="detail-step-top">
        <h4>${escapeHtml(s.name)}${s.equipment ? ' ('+escapeHtml(s.equipment)+')' : ''}</h4>
        <span class="badge ${s.status}">${s.status}</span>
      </div>`;
    if(s.status === 'Complete'){
      html += `<div class="detail-meta">Done by: ${escapeHtml(s.doneBy||'—')} ${s.time? '| '+escapeHtml(s.time):''} ${s.description? '| '+escapeHtml(s.description):''}</div>
        <div style="margin-top:8px;"><button class="btn small edit-step-status" data-id="${s.id}">Reopen step</button></div>`;
    } else if(state.activeStepInputId === s.id){
      html += `
        <div class="inline-form">
          <input type="text" id="doneBy_${s.id}" placeholder="Done by?" value="${escapeHtml(s.doneBy||'')}">
          <select id="statusSel_${s.id}">
            <option value="None" ${s.status==='None'?'selected':''}>None</option>
            <option value="Active" ${s.status==='Active'?'selected':''}>Active</option>
            <option value="Complete">Complete</option>
          </select>
          <textarea id="desc_${s.id}" placeholder="Description">${escapeHtml(s.description||'')}</textarea>
          <button class="btn green mark-done" data-id="${s.id}">Done</button>
        </div>`;
    } else {
      html += `<div class="detail-meta">Done by: ${escapeHtml(s.doneBy) || 'None'}</div>
        <div style="margin-top:8px;"><button class="btn small open-step" data-id="${s.id}">Fill in</button></div>`;
    }
    html += `</div>`;
  });

  if(node.children.length){
    html += `<div class="subprojects-heading">Sub-Projects</div>`;
    node.children.forEach(child=>{
      const pct = child.stepsTotal ? Math.round(child.stepsDone/child.stepsTotal*100) : 0;
      html += `
        <div class="card" data-id="${child.id}">
          <div class="card-top">
            <h3>${escapeHtml(child.name)}</h3>
            <span class="badge ${child.status}">${child.status}</span>
          </div>
          <div class="progress-track"><div class="progress-fill ${child.status==='Complete'?'done':''}" style="width:${pct}%"></div></div>
          <div class="steps-count">${child.stepsDone} / ${child.stepsTotal} Steps Completed${child.children.length ? ' · '+child.children.length+' sub-project'+(child.children.length===1?'':'s') : ''}</div>
        </div>`;
    });
  }

  html += `<button class="btn purple" id="addSubBtn" style="margin-top:8px;">+ ADD SUB-PROJECT</button>`;

  main.innerHTML = html;

  main.querySelectorAll('.card').forEach(c=>{
    c.onclick = ()=>{ state.detailStack.push(c.dataset.id); render(); };
  });

  document.getElementById('addSubBtn').onclick = ()=>{
    state.editingProject = newDraft(node.startDate, node.endDate);
    state.newParentId = node.id;
    state.view = 'add';
    render();
  };

  main.querySelectorAll('.open-step').forEach(btn=>{
    btn.onclick = ()=>{ state.activeStepInputId = btn.dataset.id; render(); };
  });

  main.querySelectorAll('.edit-step-status').forEach(btn=>{
    btn.onclick = async ()=>{
      const s = node.steps.find(x=>x.id===btn.dataset.id);
      s.status = 'Active';
      recomputeCurrentTree();
      await saveData(DB);
      state.activeStepInputId = s.id;
      render();
    };
  });

  main.querySelectorAll('.mark-done').forEach(btn=>{
    btn.onclick = async ()=>{
      const s = node.steps.find(x=>x.id===btn.dataset.id);
      s.doneBy = document.getElementById('doneBy_'+s.id).value.trim();
      s.status = document.getElementById('statusSel_'+s.id).value;
      s.description = document.getElementById('desc_'+s.id).value.trim();
      if(s.status === 'Complete'){
        const now = new Date();
        s.time = now.getDate()+' - '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
      }
      state.activeStepInputId = null;

      const wasComplete = node.status === 'Complete';
      recomputeCurrentTree();
      if(node.status === 'Complete' && !wasComplete){
        showToast('All steps complete!');
      }
      await saveData(DB);
      render();
    };
  });
}

/* ============ BOOT ============ */
async function bootApp(){
  const phone = document.getElementById('phone');
  phone.innerHTML = `<div class="login-loading">Loading your data…</div>`;
  try{
    await loadData();
    DB.projects.forEach(recomputeNode);
    renderAppShell();
    render();
  }catch(e){
    console.error(e);
    const detail = e && (e.message || e.error_description || e.details || String(e));
    phone.innerHTML = `<div class="login-loading">Couldn't load your data.
      <div style="color:var(--red);font-size:12px;margin-top:8px;">${escapeHtml(detail||'Unknown error')}</div><br>
      <button class="btn" onclick="bootApp()">Retry</button></div>`;
  }
}

(async function init(){
  const { data: { session } } = await sb.auth.getSession();
  if(session){
    bootApp();
  } else {
    renderLogin();
  }
})();
</script>
